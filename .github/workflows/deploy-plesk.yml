name: Deploy landing page to Plesk

on:
  push:
    branches:
      - main
    paths:
      - dist/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plesk
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload dist/ to the FTP account home (httpdocs/cnv/phan-tich-du-lieu-voi-r)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: ./
